<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#16213e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Inventario TDSur</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-icon {
            font-size: 64px;
            margin-bottom: 10px;
        }
        .logo h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .logo p {
            color: #8892b0;
            font-size: 14px;
            margin-top: 5px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #ccd6f6;
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #64ffda;
            box-shadow: 0 0 0 3px rgba(100, 255, 218, 0.1);
        }
        input::placeholder { color: #5a6a8a; }
        select option { background: #16213e; color: white; }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #64ffda 0%, #48c9b0 100%);
            color: #1a1a2e;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(100,255,218,0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error {
            background: rgba(255,82,82,0.2);
            border: 1px solid rgba(255,82,82,0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .error.show { display: block; }
        .install-prompt {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(100,255,218,0.1);
            border-radius: 10px;
            display: none;
        }
        .install-prompt.show { display: block; }
        .install-prompt button {
            background: #64ffda;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">📦</div>
            <h1>Inventario TDSur</h1>
            <p>Conteo fisico de inventario</p>
        </div>

        <div class="card">
            <div class="error" id="errorMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="usuario" placeholder="Tu usuario" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Clave</label>
                    <input type="password" id="clave" placeholder="Tu clave" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="btnLogin">
                    Ingresar
                </button>
            </form>
        </div>

        <div class="install-prompt" id="installPrompt">
            <p>📱 Instala esta app en tu celular</p>
            <button onclick="installApp()">Instalar App</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installPrompt').classList.add('show');
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const clave = document.getElementById('clave').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('btnLogin');

            btn.disabled = true;
            btn.textContent = 'Ingresando...';
            errorMsg.classList.remove('show');

            try {
                const response = await fetch('https://raw.githubusercontent.com/djtechcool-create/inventario-tdsur/main/data/usuarios.json');
                const usuarios = await response.json();

                const user = usuarios[usuario];
                if (user && user.clave === clave && user.activo && user.rol === 'trabajador') {
                    localStorage.setItem('usuario', JSON.stringify(user));
                    window.location.href = 'conteo.html';
                } else if (user && user.clave === clave && user.rol === 'admin') {
                    errorMsg.textContent = 'Este es el usuario de administrador. Usa la app de PC.';
                    errorMsg.classList.add('show');
                } else {
                    errorMsg.textContent = 'Usuario o clave incorrectos, o usuario desactivado.';
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = 'Error de conexion. Verifica tu internet.';
                errorMsg.classList.add('show');
            }

            btn.disabled = false;
            btn.textContent = 'Ingresar';
        });

        const usuarioGuardado = localStorage.getItem('usuario');
        if (usuarioGuardado) {
            const user = JSON.parse(usuarioGuardado);
            if (user.rol === 'trabajador') {
                window.location.href = 'conteo.html';
            }
        }
    </script>
</body>
</html>
