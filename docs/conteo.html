<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#16213e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Conteo Fisico - Inventario TDSur</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            color: white;
        }
        .header {
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            background: #64ffda;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a2e;
            font-weight: 700;
            font-size: 14px;
        }
        .user-name { font-weight: 600; font-size: 14px; }
        .user-role { font-size: 12px; color: #8892b0; }
        .btn-logout {
            background: rgba(255,82,82,0.2);
            border: 1px solid rgba(255,82,82,0.3);
            color: #ff5252;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #64ffda, #48c9b0);
            border-radius: 3px;
            transition: width 0.3s;
        }
        .progress-text {
            font-size: 12px;
            color: #8892b0;
            margin-top: 5px;
            text-align: right;
        }
        .container { padding: 20px; padding-bottom: 120px; }
        .product-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .product-card.completed {
            border-color: #64ffda;
            background: rgba(100,255,218,0.05);
        }
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .product-name {
            font-weight: 600;
            font-size: 16px;
            line-height: 1.3;
        }
        .product-lot {
            font-size: 13px;
            color: #8892b0;
            margin-top: 4px;
        }
        .product-status {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
        }
        .status-pending { background: rgba(255,193,7,0.2); color: #ffc107; }
        .status-done { background: rgba(100,255,218,0.2); color: #64ffda; }
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .input-group { position: relative; }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 12px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }
        .input-group input:focus {
            outline: none;
            border-color: #64ffda;
        }
        .label-buenos { color: #4caf50; }
        .label-danados { color: #f44336; }
        .label-arreglados { color: #ff9800; }
        .label-reempacados { color: #2196f3; }
        .obs-group {
            margin-top: 12px;
            grid-column: span 2;
        }
        .obs-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            resize: none;
            min-height: 60px;
        }
        .obs-group textarea:focus { outline: none; border-color: #64ffda; }
        .obs-group textarea::placeholder { color: #5a6a8a; }
        .total-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .total-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .total-ok { background: rgba(100,255,218,0.2); color: #64ffda; }
        .total-diff { background: rgba(255,193,7,0.2); color: #ffc107; }
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #16213e;
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #64ffda 0%, #48c9b0 100%);
            color: #1a1a2e;
            transition: all 0.3s;
        }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-submit:not(:disabled):hover { transform: translateY(-2px); }
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .loading.show { display: block; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #64ffda;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8892b0;
        }
        .empty-state .icon { font-size: 64px; margin-bottom: 15px; }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #64ffda;
            color: #1a1a2e;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 200;
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: #ff5252; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <div>
                    <div class="user-name" id="userName"></div>
                    <div class="user-role">Trabajador</div>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">Salir</button>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="progressText">0 de 0 productos</div>
    </div>

    <div class="container" id="mainContent">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Cargando productos...</p>
        </div>

        <div class="empty-state" id="emptyState" style="display:none">
            <div class="icon">📋</div>
            <h3>No hay productos asignados</h3>
            <p>Espera a que el administrador te asigne productos para contar.</p>
        </div>

        <div id="productosList"></div>
    </div>

    <div class="bottom-bar">
        <button class="btn-submit" id="btnSubmit" onclick="enviarReporte()" disabled>
            📤 Emitir Reporte
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const GITHUB_REPO = 'djtechcool-create/inventario-tdsur';
        const GITHUB_TOKEN = '';
        let usuario = null;
        let productos = [];

        function init() {
            const userData = localStorage.getItem('usuario');
            if (!userData) {
                window.location.href = 'index.html';
                return;
            }
            usuario = JSON.parse(userData);
            document.getElementById('userAvatar').textContent = usuario.nombre.charAt(0).toUpperCase();
            document.getElementById('userName').textContent = usuario.nombre;
            cargarProductos();
        }

        async function cargarProductos() {
            document.getElementById('loading').classList.add('show');
            try {
                let productosData = null;

                if (GITHUB_TOKEN) {
                    const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/data/productos.json`, {
                        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        productosData = JSON.parse(atob(data.content));
                    }
                }

                if (!productosData) {
                    const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO}/main/data/productos.json`);
                    productosData = await response.json();
                }

                productos = (productosData.productos || []).filter(p =>
                    p.usuario === usuario.usuario && p.activo
                );

                document.getElementById('loading').classList.remove('show');

                if (productos.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                renderProductos();
            } catch (error) {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('emptyState').style.display = 'block';
                showToast('Error al cargar productos', true);
            }
        }

        function renderProductos() {
            const container = document.getElementById('productosList');
            container.innerHTML = '';

            productos.forEach((p, idx) => {
                const total = (p.buenos||0) + (p.danados||0) + (p.arreglados||0) + (p.reempacados||0);
                const isComplete = total > 0;

                const card = document.createElement('div');
                card.className = `product-card ${isComplete ? 'completed' : ''}`;
                card.id = `card-${idx}`;

                card.innerHTML = `
                    <div class="product-header">
                        <div>
                            <div class="product-name">${p.producto}</div>
                            <div class="product-lote">Lote: ${p.lote} | Saldo: ${p.saldo_sistema} SACOS</div>
                        </div>
                        <span class="product-status ${isComplete ? 'status-done' : 'status-pending'}">
                            ${isComplete ? '✓ Listo' : 'Pendiente'}
                        </span>
                    </div>
                    <div class="input-grid">
                        <div class="input-group">
                            <label class="label-buenos">Buenos</label>
                            <input type="number" min="0" value="${p.buenos||0}"
                                   onchange="updateValue(${idx}, 'buenos', this.value)"
                                   inputmode="numeric" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label class="label-danados">Dañados</label>
                            <input type="number" min="0" value="${p.danados||0}"
                                   onchange="updateValue(${idx}, 'danados', this.value)"
                                   inputmode="numeric" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label class="label-arreglados">Arreglados</label>
                            <input type="number" min="0" value="${p.arreglados||0}"
                                   onchange="updateValue(${idx}, 'arreglados', this.value)"
                                   inputmode="numeric" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label class="label-reempacados">Reempacados</label>
                            <input type="number" min="0" value="${p.reempacados||0}"
                                   onchange="updateValue(${idx}, 'reempacados', this.value)"
                                   inputmode="numeric" placeholder="0">
                        </div>
                        <div class="obs-group">
                            <textarea placeholder="Observaciones: Que paso con este producto? (ej: 2 sacos dañados por humedad)"
                                      onchange="updateValue(${idx}, 'observaciones', this.value)"
                            >${p.observaciones||''}</textarea>
                        </div>
                    </div>
                    <div class="total-indicator">
                        <span>Total: ${total} SACOS</span>
                        <span class="total-badge ${total == p.saldo_sistema ? 'total-ok' : 'total-diff'}">
                            ${total == p.saldo_sistema ? '✓ Cuadra' : (total > p.saldo_sistema ? '+' + (total - p.saldo_sistema) + ' sobrante' : (total - p.saldo_sistema) + ' faltante')}
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });

            updateProgress();
        }

        function updateValue(idx, field, value) {
            if (field === 'observaciones') {
                productos[idx][field] = value;
            } else {
                productos[idx][field] = parseInt(value) || 0;
            }
            updateCard(idx);
            updateProgress();
        }

        function updateCard(idx) {
            const p = productos[idx];
            const total = (p.buenos||0) + (p.danados||0) + (p.arreglados||0) + (p.reempacados||0);
            const card = document.getElementById(`card-${idx}`);

            card.className = `product-card ${total > 0 ? 'completed' : ''}`;

            const status = card.querySelector('.product-status');
            status.className = `product-status ${total > 0 ? 'status-done' : 'status-pending'}`;
            status.textContent = total > 0 ? '✓ Listo' : 'Pendiente';

            const totalIndicator = card.querySelector('.total-indicator');
            totalIndicator.innerHTML = `
                <span>Total: ${total} SACOS</span>
                <span class="total-badge ${total == p.saldo_sistema ? 'total-ok' : 'total-diff'}">
                    ${total == p.saldo_sistema ? '✓ Cuadra' : (total > p.saldo_sistema ? '+' + (total - p.saldo_sistema) + ' sobrante' : (total - p.saldo_sistema) + ' faltante')}
                </span>
            `;
        }

        function updateProgress() {
            const done = productos.filter(p => (p.buenos||0) + (p.danados||0) + (p.arreglados||0) + (p.reempacados||0) > 0).length;
            const total = productos.length;
            const pct = total > 0 ? (done / total * 100) : 0;

            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = `${done} de ${total} productos`;
            document.getElementById('btnSubmit').disabled = done === 0;
        }

        async function enviarReporte() {
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = '⏳ Enviando...';

            const reporte = {
                id: `reporte_${usuario.usuario}_${Date.now()}`,
                usuario: usuario.usuario,
                nombre: usuario.nombre,
                fecha: new Date().toISOString(),
                productos: productos.map(p => ({
                    codigo: p.codigo,
                    producto: p.producto,
                    lote: p.lote,
                    saldo_sistema: p.saldo_sistema,
                    buenos: p.buenos || 0,
                    danados: p.danados || 0,
                    arreglados: p.arreglados || 0,
                    reempacados: p.reempacados || 0,
                    total_fisico: (p.buenos||0) + (p.danados||0) + (p.arreglados||0) + (p.reempacados||0),
                    observaciones: p.observaciones || ''
                }))
            };

            try {
                if (GITHUB_TOKEN) {
                    const content = btoa(unescape(encodeURIComponent(JSON.stringify(reporte, null, 2))));
                    const filename = `reportes/${reporte.id}.json`;

                    const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${filename}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Reporte de inventario - ${usuario.nombre}`,
                            content: content
                        })
                    });

                    if (response.ok) {
                        showToast('✓ Reporte enviado exitosamente');
                        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                    } else {
                        throw new Error('Error al enviar');
                    }
                } else {
                    const blob = new Blob([JSON.stringify(reporte, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${reporte.id}.json`;
                    a.click();
                    URL.revokeObjectURL(url);

                    showToast('✓ Reporte descargado. Envialo al administrador.');
                    setTimeout(() => { window.location.href = 'index.html'; }, 3000);
                }
            } catch (error) {
                showToast('Error al enviar. Intenta de nuevo.', true);
                btn.disabled = false;
                btn.textContent = '📤 Emitir Reporte';
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast show ${isError ? 'error' : ''}`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        function logout() {
            localStorage.removeItem('usuario');
            window.location.href = 'index.html';
        }

        init();
    </script>
</body>
</html>
