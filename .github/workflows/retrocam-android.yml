name: RetroCam Android

on:
  push:
    paths:
      - "retrocam/**"
      - ".github/workflows/retrocam-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retrocam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroCam-apk
          path: retrocam/app/build/outputs/apk/release/*.apk
